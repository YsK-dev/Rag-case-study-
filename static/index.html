<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Q&A System</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/transparency.css">
    <link rel="stylesheet" href="/static/page_links.css">

    <!-- MathJax for LaTeX rendering -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$']],
                displayMath: [['$$', '$$']],
                processEscapes: true
            },
            chtml: {
                fontURL: 'https://cdn.jsdelivr.net/npm/mathjax@3/es5/output/chtml/fonts/woff-v2'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>🤖 RAG Q&A System</h1>
                <p class="subtitle">Ask questions about your documents</p>
            </div>
            <div class="status-indicator">
                <span class="status-dot"></span>
                <span id="status-text">Ready</span>
            </div>
        </header>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Upload Section -->
            <div class="upload-section">
                <div class="upload-card">
                    <div class="upload-icon">📄</div>
                    <h3>Upload Document</h3>
                    <p>Upload a PDF to add it to the knowledge base</p>
                    <input type="file" id="file-input" accept=".pdf" hidden>
                    <button class="btn btn-upload" onclick="document.getElementById('file-input').click()">
                        Choose PDF File
                    </button>
                    <div id="upload-status" class="upload-status"></div>
                </div>
            </div>

            <!-- Chat Section -->
            <div class="chat-section">
                <div class="chat-container">
                    <div id="chat-messages" class="chat-messages">
                        <div class="welcome-message">
                            <div class="welcome-icon">👋</div>
                            <h2>Welcome to RAG Q&A!</h2>
                            <p>Upload a PDF document and start asking questions about it.</p>
                            <div class="example-questions">
                                <p><strong>Example questions:</strong></p>
                                <button class="example-btn" onclick="askExample('What is RAG?')">What is RAG?</button>
                                <button class="example-btn" onclick="askExample('What are the key components?')">What
                                    are the key components?</button>
                                <button class="example-btn" onclick="askExample('What are the benefits?')">What are the
                                    benefits?</button>
                            </div>
                        </div>
                    </div>

                    <div class="chat-input-container">
                        <div class="input-wrapper">
                            <input type="text" id="question-input" placeholder="Ask a question about your documents..."
                                onkeypress="handleKeyPress(event)">
                            <button class="btn btn-send" onclick="sendQuestion()">
                                <span id="send-icon">Send</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>

</html>
